# spring
spring:

    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/emis_db1.1?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&&autoReconnect=true&failOverReadOnly=false&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
        username: 'lldba'
        password: 'DB_Lldba_2023!'
        hikari:
            auto-commit: true
            connection-test-query: SELECT 1
            connection-timeout: 30000
            idle-timeout: 30000
            max-lifetime: 1800000
            maximum-pool-size: 15
            minimum-idle: 5
            pool-name: emis
    #reids，连接服务器和连接本地，本地采用无密码
    redis:
        database: 1
        host: 127.0.0.1
        port: 6379
        #        password: 
        timeout: 6000ms  # 连接超时时长（毫秒）
        lettuce:
            pool:
                max-active: 10  # 连接池最大连接数（使用负值表示没有限制）
                max-wait: 0ms      # 连接池最大阻塞等待时间（使用负值表示没有限制）
                max-idle: 10      # 连接池中的最大空闲连接
                min-idle: 5       # 连接池中的最小空闲连接
            shutdown-timeout: 200ms

#日志配置
logging:
    config: classpath:config/logback-spring.xml
    level:
        org.springframework.web: TRACE

server:
    port: 1987
    servlet:
        context-path: /
