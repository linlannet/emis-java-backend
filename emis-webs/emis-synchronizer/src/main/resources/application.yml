# spring
spring:
    # 环境 dev开发环境|prod生产环境|ver验证环境
    profiles:
        active: dev
    application:
        name: EMIS 多身份管理同步
    jackson:
        #日期格式化
        date-format: "yyyy-MM-dd HH:mm:ss"
        #设置空如何序列化
        default-property-inclusion: NON_NULL
        deserialization:
            #允许对象忽略json中不存在的属性
            fail_on_unknown_properties: false
        parser:
            #允许出现单引号
            allow_single_quotes: true
            #允许出现特殊字符和转义符
            allow_unquoted_control_chars: true
        serialization:
            #忽略无法转换的对象
            fail_on_empty_beans: false
            #格式化输出
            indent_output: true
    cache:
        type: redis
        redis:
            key-prefix: 'emis'
    servlet:
        multipart:
            max-file-size: 50MB
            max-request-size: 50MB
    session:
        redis:
            namespace: ${spring.cache.redis.key-prefix}:session
            flush-mode: immediate
        store-type: redis

    data:
        jpa:
            repositories:
                bootstrap-mode: deferred
    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
        properties:
            hibernate:
                show_sql: true
                format_sql: true
                use_sql_comments: true
                jdbc:
                    batch_size: 500
                    batch_versioned_data: true
                order_inserts: true
                types:
                    print:
                        banner: false
    main:
        banner-mode: off
#日志配置
logging:
    config: classpath:config/logback-spring.xml
server:
    shutdown: graceful
    #开启压缩 提高响应速度 减少带宽压力
    compression:
        enabled: true
        mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
        min-response-size: 1024
    servlet:
        session:
            cookie:
                #dev环境secure=false
                secure: false
                #dev环境same-site=lax
                same-site: lax
                name: emis-openapi-cookie
                http-only: true
        encoding:
            charset: UTF-8
    #错误处理
    error:
        include-stacktrace: always
        include-exception: true
        include-message: always
        include-binding-errors: always
    # undertow
    undertow:
        threads:
            io: 32
            worker: 256
        buffer-size: 1024
# springdoc
springdoc:
    swagger-ui:
        enabled: true
        csrf:
            enabled: true
            cookie-name: 'emis-csrf-cookie'
            header-name: 'emis-csrf'
    cache:
        disabled: true
    writer-with-default-pretty-printer: true

